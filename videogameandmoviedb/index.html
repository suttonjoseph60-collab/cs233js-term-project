<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Tracker</title>
</head>
<body class="bg-dark text-light">
  <header class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fs-4" href="#">Game Tracker</a>
      <nav class="nav">
        <a class="nav-link text-light" href="#search">Search</a>
        <a class="nav-link text-light" href="#games">Library</a>
      </nav>
    </div>
  </header>

  <section id="search" class="hero py-5">
    <div class="container">
      <div class="text-center mb-4">
        <h1>Discover Games</h1>
        <p class="text-muted">Search new titles from RAWG and save games to your personal library.</p>
      </div>

      <div class="input-group input-group-lg mx-auto" style="max-width: 760px;">
        <input id="global-search-input" type="text" class="form-control" placeholder="Search titles, platforms, or genres...">
        <button id="global-search-button" class="btn btn-primary">Search</button>
      </div>

      <div id="search-results" class="search-results mt-4"></div>
    </div>
  </section>

  <main>
    <section class="library-section py-5">
      <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-3 mb-4">
          <h2 id="games" class="section-title">My Game Library</h2>
          <div class="btn-group" role="group" aria-label="Filter library">
            <input type="radio" class="btn-check" name="status-filter" id="filter-all" value="all" autocomplete="off" checked>
            <label class="btn btn-outline-light" for="filter-all">All</label>
            <input type="radio" class="btn-check" name="status-filter" id="filter-playing" value="playing" autocomplete="off">
            <label class="btn btn-outline-light" for="filter-playing">Playing</label>
            <input type="radio" class="btn-check" name="status-filter" id="filter-completed" value="completed" autocomplete="off">
            <label class="btn btn-outline-light" for="filter-completed">Completed</label>
            <input type="radio" class="btn-check" name="status-filter" id="filter-want-to-play" value="want-to-play" autocomplete="off">
            <label class="btn btn-outline-light" for="filter-want-to-play">Want to Play</label>
          </div>
        </div>

        <div class="grid row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer py-4">
    <div class="container text-center text-muted">
      <p>Search powered by <a class="text-decoration-none text-light" href="https://rawg.io/" target="_blank" rel="noopener noreferrer">RAWG</a>.</p>
    </div>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
