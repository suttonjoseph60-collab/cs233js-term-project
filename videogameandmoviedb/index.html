<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Game Database</title>
    <link rel="stylesheet" href="src/styles.css">
    
</head>
<body>

    <!-- Header / Navigation -->
    <header>
        <div class="logo">Game Tracker</div>
        <nav>
            <a href="#games">Games</a>
            <a href="#lists">My Playlist</a>
        </nav>
    </header>

    <!-- Hero / Global Search -->
    <section class="hero">
        <h1>Discover Games</h1>
        <p style="color: var(--text-muted)">Track your progress, read data, and manage your collection.</p>
        <div class="search-container">
            <input id="global-search-input" type="text" class="search-input" placeholder="Search titles, genres, platforms...">
            <button id="global-search-button" class="btn">Search</button>
        </div>
        <div id="search-results" class="search-results"></div>
    </section>

    <!-- Main Entry Content -->
    <main>
        
        <!-- Video Games Section -->
        <h2 id="games" class="section-title">Your Games</h2>
        <div class="grid">
            
            <div class="card">
                <div class="card-img-placeholder">
                    [Poster Image]
                    <span class="badge">9.4</span>
                </div>
                <div class="card-content">
                    <div class="card-title">Elden Ring</div>
                    <div class="card-meta">
                        <span>Action RPG</span>
                        <span>2022</span>
                    </div>
                    <div class="tag-list">
                        <span class="tag">PC</span>
                        <span class="tag">PS5</span>
                        <span class="tag">Xbox</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-img-placeholder">
                    [Poster Image]
                    <span class="badge">8.9</span>
                </div>
                <div class="card-content">
                    <div class="card-title">Hades II</div>
                    <div class="card-meta">
                        <span>Roguemonkey</span>
                        <span>2024</span>
                    </div>
                    <div class="tag-list">
                        <span class="tag">PC</span>
                        <span class="tag">Early Access</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-img-placeholder">
                    [Poster Image]
                    <span class="badge">9.2</span>
                </div>
                <div class="card-content">
                    <div class="card-title">Cyberpunk 2077</div>
                    <div class="card-meta">
                        <span>Sci-Fi RPG</span>
                        <span>2020</span>
                    </div>
                    <div class="tag-list">
                        <span class="tag">PC</span>
                        <span class="tag">PS5</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="src/main.js"></script>
</body>

</html>
